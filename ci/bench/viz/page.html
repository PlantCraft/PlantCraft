<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;font:13px system-ui,sans-serif;background:#fff;color:#111}#app{width:100vw;position:relative;overflow:hidden}</style>
<link rel="stylesheet" href="" id="css"></head>
<body><div id="app"></div><script type="module">
const c = new URLSearchParams(location.search).get("case");
fetch(`dist/${c}.css`, { method: "HEAD" }).then((r) => { if (r.ok) document.getElementById("css").href = `dist/${c}.css`; });
import(`./dist/${c}.js`);
</script></body></html>
