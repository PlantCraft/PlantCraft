# PlantCraft Analytics's manifest: the single source of its metadata (PlantCraft app standard, section 4).
# The launcher card, the Apps page, the package, the image labels and /api/meta read it;
# tests/test_app_standard.py checks that nothing else disagrees with it.

[app]
id = "linkcraft"
name = "PlantCraft Analytics"
version = "0.5.1"
category = "Signal quality and control loop performance"
summary = "Scheduled monitors, diagnostics and KPIs for signals and control loops: finds bad data, oscillation, sticking valves and manual mode, and says why."
description = """PlantCraft Analytics analyses the signals and control loops PlantCraft describes. Its \
analyses are methods wired into protocols that run on a cadence: the Signal quality protocol \
checks every signal's raw samples for gaps, stale, frozen, spiky, out-of-range, noisy, coarse \
and drifting data; the loop round scores each loop's health from its recorded data, ranks the \
portfolio worst first and names what limits each loop (oscillation, a sticky valve, saturation, \
manual mode, poor tracking or unusable data), with a help page per method. For process and \
control engineers. It needs PlantCraft's signal catalog and history, loop assets with PV and \
OP signals bound, and an app key for its background runs."""
publisher = "PlantCraft"
license = "Apache-2.0"
homepage = ""
mark = "linkcraft"

[runtime]
prefix = "/link/"
port = 8140
uid = 10012
health = "/healthz"
image = "linkcraft"

[requires]
processcraft_api = ">=1.0"
sdk = "0.92.0"
asset_types = ["loop"]
roles = { loop = ["pv", "op"] }

[permissions]
read = ["assets", "signals", "series", "results"]
write = ["audit", "results", "events", "runs", "schedules", "knowledge", "series", "compute"]
plant_write = false
outbound = []

# loop_health and signal_quality are also written as derived series, one point per round
# (PUT /api/v1/series): app-linkcraft:<loop id>.health (number, /100) and
# app-linkcraft:<loop id>.status (text), subject asset:<loop id>, result loop_health; and
# app-linkcraft:<signal id>.quality (number, /100), subject the signal, result signal_quality.
# The manifest of plantcraft-sdk 0.8.3 has no field for derived series ([publishes] takes
# results and events; [permissions] write has no "series"): they are declared through the
# result they come from. signal_quality on "asset" is the worst verdict of an asset's signals.
# Results CPMCraft and DataCraft published (cpmcraft.loop_health, datacraft.signal_quality) and
# their series (app-cpmcraft:*, app-datacraft:*) stay readable in PlantCraft.
# Its data folder in the suite's backup (PlantCraft docs/operations.md).
[backup]
sqlite = ["linkcraft.sqlite3"]
files = ["linkcraft-app-key"]
skip = ["logs/"]

[publishes]
results = [
  { kind = "loop_health", subject = "asset:loop" },
  { kind = "signal_quality", subject = "signal" },
  { kind = "signal_quality", subject = "asset" },
]

# The events Link writes (PlantCraft docs/app-standard.md, section 6). Link reports; the Alarms
# app's rules decide what becomes an alarm and who hears it. Conditions (a finding, a message
# of an algorithm, a subject's state in a schedule, a stalled schedule) are sent as start and
# end with one key.
[[publishes.events]]
name = "status.changed"
title = "Target state changed in a monitor"
description = "A target went to warning or critical in a monitor (start), or back to ok (end). Key: <monitor id>:<target>."
severity = "warning"
category = "process"
phase = "interval"
payload = { schedule_id = "Monitor", status = "New state", previous_status = "State before", owner = "Monitor owner", url = "Page that shows it" }
rule = { when = "open", minutes = 60, priority = "medium", notify = "owner" }

[[publishes.events]]
name = "run.failed"
title = "Monitored run failed"
description = "A monitored run failed: once per run of the monitor, however many of its targets failed (the first is the target)."
severity = "warning"
category = "run"
payload = { schedule_id = "Monitor", schedule_name = "Monitor name", run_at = "The run that failed", owner = "Monitor owner", url = "Page that shows it" }
rule = { when = "event", priority = "medium", notify = "owner" }

[[publishes.events]]
name = "schedule.stalled"
title = "Monitor stopped running"
description = "A monitor has not run for two of its periods (start), or ran again (end). One condition per monitor, about Analytics itself. Key: stalled:<monitor id>."
severity = "warning"
category = "run"
phase = "interval"
payload = { schedule_id = "Monitor", schedule_name = "Monitor name", subjects = "Targets it judges", owner = "Monitor owner" }
rule = { when = "open", minutes = 30, priority = "high", notify = "owner" }

[[publishes.events]]
name = "finding.opened"
title = "Loop finding opened"
description = "A loop method found a problem (oscillation, sticky valve, manual mode...). Key: <loop>/<method>."
severity = "warning"
category = "process"
phase = "interval"
payload = { method_id = "Method", method_name = "Method name", status = "warning or bad", score = "Method score", url = "Loop page" }

[[publishes.events]]
name = "finding.closed"
title = "Loop finding closed"
description = "The finding of a loop method is gone. Same key as when it opened."
severity = "ok"
category = "process"
phase = "interval"
payload = { method_id = "Method", method_name = "Method name", opened_at = "When it opened" }

[[publishes.events]]
name = "protocol.alert"
title = "Algorithm message raised"
description = "A message block of an algorithm triggered on an asset. Key: <asset>/<message>."
severity = "warning"
category = "process"
phase = "interval"
payload = { output = "Message output", status = "Status", score = "Value", url = "Asset page" }

[[publishes.events]]
name = "protocol.cleared"
title = "Algorithm message cleared"
description = "The message block no longer triggers. Same key as when it was raised."
severity = "ok"
category = "process"
phase = "interval"
payload = { opened_at = "When it was raised" }

# What the assistant does on Link's pages (PlantCraft docs/assistant.md, "What each page offers"):
# each page names itself in useAssistantPage({page: "linkcraft:<id>"}). A block and an algorithm are
# finished in their own forms (code to test, a diagram to draw): those works open the form filled
# in; "Help me change this block" opens the block's next version ({subject}: the block on screen).
[[contributes.assistant.works]]
id = "new-block"
pages = ["blocks", "block-new"]
kind = "create"
level = "admin"
title = "Help me create a new block"
hint = "Say what it must compute; the form opens filled in to test and create"
instructions = """Help the person write a new Analytics block: one calculation with typed inputs and outputs, parameters and Python code (def run(inputs, params, ctx) returning a dict of outputs; inputs are pandas series by port name; numpy and pandas only). Ask what it must compute and from which signals if they have not said it. Look at Analytics' blocks first (the person may only need an existing one) and say so if one fits. List inputs and outputs as "port: what it is" and parameters as "name = default: what it is". Then propose it; the person tests it on an asset in the form before creating it."""
object = "block"
form = "/link/blocks/new"
[[contributes.assistant.works.fields]]
key = "name"
title = "Name"
required = true
max_length = 120
[[contributes.assistant.works.fields]]
key = "summary"
title = "What it computes"
type = "long_text"
required = true
max_length = 500
[[contributes.assistant.works.fields]]
key = "inputs"
title = "Inputs"
type = "list"
help = "port: what it is"
max_length = 200
[[contributes.assistant.works.fields]]
key = "outputs"
title = "Outputs"
type = "list"
required = true
help = "port: what it is"
max_length = 200
[[contributes.assistant.works.fields]]
key = "parameters"
title = "Parameters"
type = "list"
help = "name = default: what it is"
max_length = 200
[[contributes.assistant.works.fields]]
key = "code"
title = "Python code"
type = "long_text"
required = true
max_length = 20000

[[contributes.assistant.works]]
id = "find-block"
pages = ["blocks", "block-new"]
title = "Which block computes what I need?"
hint = "Among Analytics' blocks, before writing one"
ask = "What do you want to compute?"
instructions = """Find the Analytics blocks that compute what the person describes (read Analytics' help and the blocks it describes): name each by its title as the page shows it, what it computes, its inputs and outputs, and how well it fits. Say plainly when none does: then a new block is the way."""

[[contributes.assistant.works]]
id = "about-block"
pages = ["block"]
title = "Explain this block"
hint = "What it computes, line by line, and how to read its outputs"
context = ["name", "summary", "inputs", "outputs", "parameters", "code"]
instructions = """Explain the block on this page from its facts (name, inputs, outputs, parameters and code): what it computes, how its code does it in a few steps, how to read each output, and its assumptions and limits."""

[[contributes.assistant.works]]
id = "change-block"
pages = ["block"]
kind = "create"
level = "admin"
title = "Help me change this block"
hint = "Say what to change; its next version opens filled in to test and save"
context = ["name", "summary", "inputs", "outputs", "parameters", "code", "used_by"]
instructions = """Help the person change the block on this page (its facts hold its current code, ports and parameters): one calculation with typed inputs and outputs, parameters and Python code (def run(inputs, params, ctx) returning a dict of outputs; inputs are pandas series by port name; numpy and pandas only). Ask what to change if they have not said it. Keep its inputs and outputs unless the change needs others, and say so plainly when it does: the algorithms that use it (used_by) keep their version until someone updates them. Propose the whole new code, the summary and what changed; the person tests it in the form and saves it as a new version."""
object = "block"
form = "/link/blocks/{subject}/edit"
[[contributes.assistant.works.fields]]
key = "code"
title = "Python code"
type = "long_text"
required = true
max_length = 20000
[[contributes.assistant.works.fields]]
key = "summary"
title = "What it computes"
type = "long_text"
max_length = 500
[[contributes.assistant.works.fields]]
key = "change"
title = "What changed"
type = "long_text"
required = true
max_length = 2000

[[contributes.assistant.works]]
id = "block-variant"
pages = ["block"]
kind = "create"
level = "admin"
title = "Make a new block from this one"
hint = "A variant with its own name; the new block's form opens filled in"
context = ["name", "summary", "inputs", "outputs", "parameters", "code"]
instructions = """Help the person make a new block that starts from the one on this page (its facts hold its code, ports and parameters): one calculation with typed inputs and outputs, parameters and Python code (def run(inputs, params, ctx) returning a dict of outputs; inputs are pandas series by port name; numpy and pandas only). Ask how the new block must differ if they have not said it, give it its own name, and propose all its fields; the person tests it in the form before creating it. The block on this page stays as it is."""
object = "block"
form = "/link/blocks/new"
[[contributes.assistant.works.fields]]
key = "name"
title = "Name"
required = true
max_length = 120
[[contributes.assistant.works.fields]]
key = "summary"
title = "What it computes"
type = "long_text"
required = true
max_length = 500
[[contributes.assistant.works.fields]]
key = "inputs"
title = "Inputs"
type = "list"
help = "port: what it is"
max_length = 200
[[contributes.assistant.works.fields]]
key = "outputs"
title = "Outputs"
type = "list"
required = true
help = "port: what it is"
max_length = 200
[[contributes.assistant.works.fields]]
key = "parameters"
title = "Parameters"
type = "list"
help = "name = default: what it is"
max_length = 200
[[contributes.assistant.works.fields]]
key = "code"
title = "Python code"
type = "long_text"
required = true
max_length = 20000

[[contributes.assistant.works]]
id = "block-used"
pages = ["block"]
title = "Where is it used?"
hint = "The algorithms that use it, and what a change would affect"
context = ["name", "used_by", "versions"]
instructions = """Say which algorithms use the block on this page and which version each names (the facts: used_by, versions), what their results depend on from it, and what a change of its inputs or outputs would ask of each."""

[[contributes.assistant.works]]
id = "new-algorithm"
pages = ["algorithms", "algorithm-new"]
kind = "create"
level = "editor"
title = "Help me design a new algorithm"
hint = "Say what it must judge; the form opens filled in, then the diagram"
instructions = """Help the person design a new Analytics algorithm: a diagram of blocks that judges assets, control loops or signals on a cadence. Ask what it must judge and on what if they have not said it. Read the blocks first (list_app_objects, app linkcraft, kind block; get_app_object for one block's ports and parameters) and use only blocks that exist. Say which blocks to place and how to wire them, step by step, in your answer; then propose its name, what it works on (asset, loop or signal), a description of what it judges and how to read its result, and its diagram as text, one line each: `name = block_id` places a block (e.g. `pv = input.signal`), `a -> b` wires a's first fitting output to b's first free input, `a.output -> b.input` wires named ports, `name.parameter = value` sets a parameter. Use the ports the blocks have (get_app_object): wire an output only into an input that takes its type (a verdict gives result; a condition takes intervals), and name wires by the names you gave the blocks. A constant is a block's parameter. Start with the input blocks and end with an output block. Always give the diagram, unless you give the id of an existing algorithm to start from because one is close (the algorithms page lists them). The diagram's window opens with the blocks placed and wired; the person checks and saves it."""
object = "algorithm"
form = "/link/algorithms/new"
[[contributes.assistant.works.fields]]
key = "name"
title = "Name"
required = true
max_length = 120
[[contributes.assistant.works.fields]]
key = "works_on"
title = "Works on"
type = "choice"
options = ["asset", "loop", "signal"]
required = true
[[contributes.assistant.works.fields]]
key = "description"
title = "Description"
