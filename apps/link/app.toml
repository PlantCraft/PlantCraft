max_length = 120
[[contributes.assistant.works.fields]]
key = "diagram"
title = "Diagram (blocks and wires, one per line)"
type = "long_text"
max_length = 4000

[[contributes.assistant.works]]
id = "find-algorithm"
pages = ["algorithms", "algorithm-new"]
title = "Which algorithm judges what I need?"
hint = "Among Analytics' algorithms"
ask = "What do you want to watch?"
instructions = """Find the algorithms that judge what the person describes (the view section lists the ones on the page; read Analytics' help for more): name each, what it judges, on which targets, and how well it fits."""

[[contributes.assistant.works]]
id = "about-algorithm"
