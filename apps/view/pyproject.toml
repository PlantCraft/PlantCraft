[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashcraft"
version = "0.5.1"
description = "PlantCraft View: dashboards and trends of plant signals for the PlantCraft suite"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    # Not on any index: install it from vendor/ first
    # (pip install --no-index --find-links vendor plantcraft-sdk==0.85.0).
    "plantcraft-sdk==0.85.0",
    "fastapi>=0.116,<1",
    "httpx>=0.27,<1",
    # Word reports' charts as images (HPND); reportlab installs it too.
    "pillow>=10,<14",
    "pydantic>=2.7,<3",
    # Reports as PDF (BSD); the same pin as PlantCraft Analytics.
    "reportlab>=4,<6",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.17.1",
]
# Browser journeys (tests/e2e, `make e2e`); test-only, never in the image.
e2e = [
    "playwright==1.64.0",
]

[project.urls]
Repository = "https://github.com/PlantCraft/PlantCraft/tree/main/apps/view"

[project.scripts]
dashcraft = "dashcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dashcraft*"]

# The symbol library of diagrams: one JSON file per symbol.
[tool.setuptools.package-data]
dashcraft = ["diagrams/symbols/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # The SDK's FakePlantCraft hands out Starlette's TestClient.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# The test time budget (PlantCraft docs/testing.md); about twice the measured run.
[tool.plantcraft.tests]
test_seconds = 10
slow_seconds = 120
suite_seconds = 180  # the browser journeys took 122 s on the shared Mac mini runner (2026-10-27)

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
extend-exclude = ["frontend", "vendor"]

[tool.ruff.lint]
# Keep the gate small: real errors (pyflakes) and import order.
select = ["F", "I", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["dashcraft"]
known-third-party = ["plantcraft_sdk"]
