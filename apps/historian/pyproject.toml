[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histcraft"
version = "0.5.1"
description = "PlantCraft Historian: the historian of the PlantCraft suite"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    # Not on any index: install it from vendor/ first
    # (pip install --no-index --find-links vendor plantcraft-sdk==0.102.0).
    "plantcraft-sdk==0.102.0",
    "asyncua>=1.1.8,<2",
    # Source passwords encrypted at rest (histcraft.vault).
    "cryptography>=43,<51",
    "fastapi>=0.116,<1",
    "httpx>=0.27,<1",
    "numpy>=2",
    # Excel workbooks in Import & export (pandas reads .xlsx through it).
    "openpyxl>=3.1,<4",
    # Sparkplug B sources (histcraft.collector.sparkplug): an MQTT client that only subscribes.
    # Eclipse Paho (EPL-2.0 or EDL-1.0, BSD-style), pure Python, no dependencies of its own.
    "paho-mqtt>=2.1,<3",
    "pandas>=2.2",
    # PostgreSQL, the archive's database in plants (SQLite stays for tests and demos).
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "pydantic>=2.7,<3",
    # PI Web API sources (histcraft.sources.pi_web_api); basic auth works with this alone.
    "requests>=2.31,<3",
    "uvicorn>=0.35,<1",
    # The archive's chunks (histcraft.archive.codec, BSD): Python 3.14 has zstd built in.
    "zstandard>=0.23,<1; python_version < '3.14'",
]

[project.optional-dependencies]
# Kerberos to PI Web API: needs the system's krb5 libraries to build (gssapi has no wheels),
# so it is not in the default image (docs/gaps.md G19).
kerberos = ["requests-kerberos>=0.14,<1"]
dev = [
    "pytest>=8",
    "ruff==0.17.1",
]

[project.urls]
Repository = "https://github.com/PlantCraft/PlantCraft/tree/main/apps/historian"

[project.scripts]
histcraft = "histcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["histcraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# The test time budget (PlantCraft docs/testing.md); about twice the measured run.
[tool.plantcraft.tests]
test_seconds = 10
slow_seconds = 120
suite_seconds = 180  # GitHub's 2-core runners, about 1.5x the Mac mini (2026-10-25)

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
extend-exclude = ["frontend", "vendor"]

[tool.ruff.lint]
select = ["F", "I", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["histcraft"]
known-third-party = ["plantcraft_sdk"]
