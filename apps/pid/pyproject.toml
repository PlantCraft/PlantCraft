[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pidcraft"
version = "0.1.0"
description = "PlantCraft PID: the plant's P&IDs read into a plant map (closed source)"
readme = "README.md"
license = {text = "LicenseRef-PlantCraft-EULA"}
requires-python = ">=3.11"
dependencies = [
    # Not on any index: install it from vendor/ first
    # (pip install --no-index --find-links vendor plantcraft-sdk==0.102.0).
    "plantcraft-sdk==0.102.0",
    "fastapi>=0.116,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.35,<1",
    # The drawings read into tags and lines (pdfplumber and pdfminer.six: MIT; pypdfium2:
    # Apache-2.0/BSD, draws a page for the review; Pillow: HPND; numpy: BSD). OCR of scans uses
    # the tesseract program when the image has it.
    "numpy>=2,<3",
    "pdfplumber>=0.11,<0.12",
    "pypdfium2>=4.30,<6",
    "pillow>=10,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "reportlab>=4,<6",  # tools/evaluate.py and the tests draw the demo's P&IDs as PDF
    "ruff==0.17.1",
]
# Browser journeys (tests/e2e, `make e2e`); test-only, never in the image.
e2e = [
    "playwright==1.64.0",
]

[project.scripts]
pidcraft = "pidcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pidcraft*"]

[tool.setuptools.package-data]
"pidcraft.plantmap.sample" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # The SDK's FakePlantCraft hands out Starlette's TestClient.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# The test time budget (PlantCraft docs/testing.md); about twice the measured run.
[tool.plantcraft.tests]
test_seconds = 10
slow_seconds = 120
suite_seconds = 90  # GitHub's 2-core runners, about 1.5x the Mac mini (2026-10-25)

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
extend-exclude = ["frontend", "vendor"]

[tool.ruff.lint]
# Keep the gate small: real errors (pyflakes) and import order.
select = ["F", "I", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["pidcraft"]
known-third-party = ["plantcraft_sdk"]
