# StarterCraft's manifest: the single source of its metadata (the suite's app standard, section 4).
# The launcher card, the Apps page, the package manifest, the image labels and /api/meta read it.
# `make rename NAME=Logbook` makes it LogbookCraft (`logbook`, prefix /logbook/) everywhere.

[app]
id = "starter"
name = "StarterCraft"
version = "0.2.0"
category = "Example"
summary = "The smallest app of the PlantCraft suite: a note on any asset of the plant."
description = """\
A starting point for an app of one's own: notes on the assets of PlantCraft's asset tree, \
listed and kept in the app's own database. It has only the parts every app of the suite needs: \
the manifest, the server on the SDK, the interface on the suite's frame, a help page, the tests \
and the signed package."""
# "Dev Publisher" matches PlantCraft's development key (`make dev-package`); a real release names
# the company whose key the stack trusts (prompts/05-package-and-install.md).
publisher = "Dev Publisher"
license = "Apache-2.0"
homepage = ""
mark = "starter"

[runtime]
# An app outside the suite table takes a prefix, port and container user that no suite app
# uses (docs/app-standard.md, section 7, of PlantCraft): a port from 9000 and a user from 20000.
prefix = "/starter/"
port = 9100
uid = 20100
health = "/healthz"
image = "starter"

[requires]
processcraft_api = ">=1.0"
sdk = "0.105.0"
asset_types = []
roles = {}

[permissions]
read = ["assets"]
write = ["audit"]
plant_write = false
outbound = []

[publishes]
results = []

[consumes]
results = []

# What the app adds to PlantCraft's own screens (Ctrl+K search, widgets, Desk's calendar and
# to-do, language model uses, references) and the events it writes go in [contributes] and
# [[publishes.events]]. This template starts without any: docs/recipes/ has one recipe each.

[backup]                            # its data folder in the suite's backup (PlantCraft docs/operations.md)
sqlite = ["starter.sqlite3"]
skip = ["logs/"]

[suggests]
asset_types = []

# Coming in the PlantCraft release after 0.6.0 (the app package format, PlantCraft PR #179): uncomment
# when the SDK in vendor/ knows these keys; docs/packaging.md says what each one means.
#
# [app]  (these two go under [app] above)
# source = "open"                   # "closed": compiled image and a licence
# languages = ["en", "pt-BR"]       # each language other than "en" needs its locales/<lang>.json
#
# [requires]  (this one goes under [requires] above)
# platform = ">=0.7,<0.9"           # PlantCraft versions the app installs on
#
# [license]                         # closed apps only: a signed .pclicense per installation
# required = true
# grace_days = 14
