# Dependabot keeps the actions' commit pins current (docs/contributing-safety.md): every action is
# pinned to a full commit SHA, so a moved tag never changes what CI runs. Python and npm packages
# stay pinned by hand (make lock, npm ci), each bump in its own reviewed pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
