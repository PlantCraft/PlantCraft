name: Historian

# Historian (apps/historian/): runs only when that folder changes. CI budget and cadence:
# ci/macmini/README.md. Pull requests run no tests here: the Lint and Security workflows check every
# pull request, and contributors run this folder's `make ci` locally before merging. The tests run
# on main four times a day (the schedule below) when the folder changed since the last green run,
# and by hand (Actions > this workflow > Run workflow). A push to main redeploys this app on the Mac
# mini's local suite (repository variable MACMINI_DEPLOY) without waiting for them. The container
# jobs run by hand with "hosted" ticked, or on main while the Mac mini is off. Documentation-only
# changes run nothing.
on:
  push:
    branches: [main]
    paths:
      - "apps/historian/**"
      - "!apps/historian/**/*.md"
      - "!apps/historian/docs/**"
      - "simulator/src/simcraft/testkit/**"
      - ".github/workflows/historian.yml"
  pull_request:
    paths:
      - "apps/historian/**"
      - "!apps/historian/**/*.md"
      - "!apps/historian/docs/**"
      - "simulator/src/simcraft/testkit/**"
      - ".github/workflows/historian.yml"
  # The tests of main at about 09:00, 13:00, 17:00 and 21:00 Brasília (UTC-3; cron is UTC).
  schedule:
    - cron: "17 0,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      hosted:
        description: "Also the jobs on GitHub's runners (containers, macOS, Windows): paid minutes"
        type: boolean
        default: false

# A newer push to a pull request cancels its older run; runs on main are grouped by event and
# commit, so a merge's deploy and a scheduled test run never wait on each other.
concurrency:
  group: historian-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/historian

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

jobs:
  # Scheduled runs only: test only if this workflow's folder changed since its last green run.
  changes:
    if: github.event_name == 'schedule'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.TEST_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci
      - id: gate
        run: python3 ci/since-green
        env:
          GH_TOKEN: ${{ github.token }}

  ci:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.run == 'true') }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.TEST_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      # One runner serves every folder: each job gets a Python environment of its own, so nothing
      # an earlier job installed (another folder's SDK of the same version) stands in for this one's.
      - run: rm -rf "$RUNNER_TEMP/venv" && python -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/historian/frontend/package-lock.json
      # plantcraft-sdk comes from vendor/ only (pip install --no-index --find-links vendor).
      - run: make ci

  # Every source kind against the Simulator's test kit, with the suite's pinned Telegraf
  # (make sources-check, docs/source-checks.md). SQL runs where a PostgreSQL can start (initdb as
  # a non-root user) and is skipped, and said so, where it cannot.
  sources:
    needs: [ci]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.TEST_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: rm -rf "$RUNNER_TEMP/venv" && python -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: make deps
      # Sparkplug B runs on Eclipse Mosquitto when it can be installed (else amqtt's broker).
      - run: if command -v apt-get >/dev/null; then sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mosquitto; fi
      - run: make sources-check
        env:
          HISTCRAFT_SOURCES_STRICT: "1"

  # The whole suite again on PostgreSQL, PlantCraft Historian's database in plants (SQLite in the job above).
  postgres:
    if: inputs.hosted || (github.event_name == 'push' && vars.MACMINI_DEPLOY != 'true')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: histcraft
          POSTGRES_PASSWORD: histcraft-ci
          POSTGRES_DB: histcraft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U histcraft" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      # One runner serves every folder: each job gets a Python environment of its own, so nothing
      # an earlier job installed (another folder's SDK of the same version) stands in for this one's.
      - run: rm -rf "$RUNNER_TEMP/venv" && python -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: make deps
      - run: make test-postgres
        env:
          HISTCRAFT_TEST_DATABASE_URL: postgresql://histcraft:histcraft-ci@127.0.0.1:5432/histcraft

  docker:
    if: inputs.hosted || (github.event_name == 'push' && vars.MACMINI_DEPLOY != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t histcraft:ci .
      - name: The image ships its SBOM (/app/sbom.json, CycloneDX) for the suite's bundle
        run: |
          docker run --rm histcraft:ci python -c "import json; d = json.load(open('/app/sbom.json')); names = {c['name'] for c in d['components']}; assert d['bomFormat'] == 'CycloneDX' and {'histcraft', 'fastapi', 'react'} <= names, names"
      - name: The image starts read-only as in the suite's compose file and answers /healthz
        run: |
          docker run -d --name hist --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -v histdata:/data -p 8100:8100 histcraft:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8100/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8100/hist/healthz
          docker logs hist
          docker rm -f hist
      - name: The collector starts read-only with no port and reports healthy
        run: |
          docker run -d --name collect --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --user 10013:10008 -v histdata:/data \
            histcraft:ci histcraft collect
          for i in $(seq 20); do docker exec collect histcraft healthcheck && ok=1 && break; sleep 3; done
          docker logs collect
          docker rm -f collect
          test "$ok" = 1
      - name: On its PostgreSQL database, hardened as in deploy/compose.histcraft.yaml
        run: |
          docker network create hist
          mkdir -p dbdata && sudo chown 10008:10008 dbdata && sudo chmod 700 dbdata
          printf 'histcraft-ci-secret' > dbpw && sudo chown 10008:10008 dbpw && sudo chmod 400 dbpw
          docker run -d --name histcraft-db --network hist --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 10008:10008 \
            --tmpfs /tmp --tmpfs /var/run/postgresql:uid=10008,gid=10008,mode=0700 \
            -v "$PWD/dbdata:/var/lib/postgresql/data" -v "$PWD/dbpw:/run/secrets/pw:ro" \
            -e POSTGRES_USER=histcraft -e POSTGRES_DB=histcraft \
            -e POSTGRES_PASSWORD_FILE=/run/secrets/pw -e PGDATA=/var/lib/postgresql/data/pgdata \
            -e POSTGRES_INITDB_ARGS="--auth-host=scram-sha-256 --data-checksums" \
            postgres:17.11-trixie@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
          for i in $(seq 30); do docker exec histcraft-db pg_isready -U histcraft && break; sleep 2; done
          docker run -d --name histpg --network hist --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -v histpgdata:/data -p 8101:8100 \
            -v "$PWD/dbpw:/run/secrets/histcraft_db_password:ro" \
            -e HISTCRAFT_DATABASE_URL=postgresql://histcraft@histcraft-db:5432/histcraft \
            -e HISTCRAFT_DATABASE_PASSWORD_FILE=/run/secrets/histcraft_db_password histcraft:ci
          for i in $(seq 30); do docker exec histpg histcraft healthcheck && ok=1 && break; sleep 3; done
          curl -fsS http://127.0.0.1:8101/healthz
          docker exec histcraft-db psql -U histcraft -d histcraft -tc "SELECT count(*) FROM chunks" \
            || ok=0
          docker logs histpg 2>&1 | grep -v histcraft-ci-secret | tail -20
          ! docker logs histpg 2>&1 | grep -q histcraft-ci-secret
          docker rm -f histpg histcraft-db
          test "$ok" = 1

  # The Mac mini's local suite follows main: the image is rebuilt there and only this app's
  # container is recreated, data kept (ci/macmini/suite-deploy from this checkout, so the deploy hold applies).
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.MACMINI_DEPLOY == 'true'
    runs-on: [self-hosted, macmini]
    concurrency:
      group: deploy-historian
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make image
      - run: ../../ci/macmini/suite-deploy histcraft=histcraft
