name: Labels

# Keeps the repository's labels as .github/labels.yml says, so issue forms, the Zones check and
# the triage in docs/maintainers.md all use the same names. Runs on main when the file changes.
on:
  push:
    branches: [main]
    paths: [".github/labels.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'PlantCraft/PlantCraft'
    runs-on: ubuntu-latest
    # The one write a workflow has: labels, from a push to main or a maintainer's run, never from
    # a pull request (tests/test_contributing_safety.py holds it to that).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create or update each label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY' | while IFS=$'\t' read -r name color description; do
          import yaml
          for label in yaml.safe_load(open(".github/labels.yml")):
              print(f"{label['name']}\t{label['color']}\t{label['description']}")
          PY
            gh label create "$name" --color "$color" --description "$description" --force
          done
