name: Local LLM (Ollama)

# The assistant on a plant's own model (docs/integrators.md): a real Ollama server on the runner,
# a small model pulled into it, and tests/test_ollama_live.py through the same code a plant runs
# (Setup › Language models, the assistant's read-only tools, the audit log). On pull requests that
# touch the model client or the assistant, every Monday on main, and by hand with another model.
# GitHub's own runner, not the Mac mini: the model needs a few GB of disk and memory.
on:
  pull_request:
    paths:
      - "plantcraft/specialists/model.py"
      - "plantcraft/assistant_chat/**"
      - "plantcraft/assistant_access/**"
      - "tests/test_ollama_live.py"
      - ".github/workflows/ollama.yml"
  # Mondays about 06:30 Brasília (UTC-3; cron is UTC).
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model to test (it must fit the runner: 16 GB of memory, CPU only)"
        default: "qwen2.5:1.5b"
      image:
        description: "Ollama image"
        default: "ollama/ollama:0.12.6"

concurrency:
  group: ollama-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MODEL: ${{ inputs.model || 'qwen2.5:1.5b' }}
      IMAGE: ${{ inputs.image || 'ollama/ollama:0.12.6' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      # The assistant's instructions and tools are longer than Ollama's default context (4,096
      # tokens), which it would cut without a word: the guide says to raise it, and so does this.
      - name: Start Ollama
        run: |
          docker run -d --name ollama -p 127.0.0.1:11434:11434 \
            -e OLLAMA_CONTEXT_LENGTH=16384 "$IMAGE"
          for _ in $(seq 60); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          docker exec ollama ollama pull "$MODEL"
      - run: python -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -e sdk/python -e ".[server,opcua,dev]"
      - name: pytest tests/test_ollama_live.py
        env:
          PLANTCRAFT_TEST_OLLAMA_URL: http://127.0.0.1:11434/v1
          PLANTCRAFT_TEST_OLLAMA_MODEL: ${{ env.MODEL }}
          # A CPU model takes minutes per answer: these tests are timed by the job, not the budget.
          PLANTCRAFT_TEST_BUDGET: "off"
        run: pytest -v -s tests/test_ollama_live.py
      - if: failure()
        run: docker logs --tail 200 ollama
