name: Documents

# Documents (apps/documents/): runs only when that folder changes. CI budget and cadence:
# ci/macmini/README.md. Pull requests run no tests here: the Lint and Security workflows check every
# pull request, and contributors run this folder's `make ci` locally before merging. The tests and
# browser journeys run on main four times a day (the schedule below) when the folder changed since
# the last green run, and by hand (Actions > this workflow > Run workflow). A push to main redeploys
# this app on the Mac mini's local suite (repository variable MACMINI_DEPLOY) without waiting for
# them. The container jobs run by hand with "hosted" ticked, or on main while the Mac mini is off.
# Documentation-only changes run nothing.
on:
  push:
    branches: [main]
    paths:
      - "apps/documents/**"
      - "!apps/documents/**/*.md"
      - "!apps/documents/docs/**"
      - ".github/workflows/documents.yml"
  pull_request:
    paths:
      - "apps/documents/**"
      - "!apps/documents/**/*.md"
      - "!apps/documents/docs/**"
      - ".github/workflows/documents.yml"
  # The tests of main at about 09:00, 13:00, 17:00 and 21:00 Brasília (UTC-3; cron is UTC).
  schedule:
    - cron: "27 0,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      hosted:
        description: "Also the jobs on GitHub's runners (containers, macOS, Windows): paid minutes"
        type: boolean
        default: false

# A newer push to a pull request cancels its older run; runs on main are grouped by event and
# commit, so a merge's deploy and a scheduled test run never wait on each other.
concurrency:
  group: documents-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/documents

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

jobs:
  # Scheduled runs only: test only if this workflow's folder changed since its last green run.
  changes:
    if: github.event_name == 'schedule'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.TEST_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: ci
      - id: gate
        run: python3 ci/since-green
        env:
          GH_TOKEN: ${{ github.token }}

  ci:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.run == 'true') }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.TEST_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      # One runner serves every folder: each job gets a Python environment of its own, so nothing
      # an earlier job installed (another folder's SDK of the same version) stands in for this one's.
      - run: rm -rf "$RUNNER_TEMP/venv" && python -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/documents/frontend/package-lock.json
      # plantcraft-sdk comes from vendor/ only (pip install --no-index --find-links vendor).
      - run: make ci

  e2e:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.run == 'true') }}
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.TEST_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      # One runner serves every folder: each job gets a Python environment of its own, so nothing
      # an earlier job installed (another folder's SDK of the same version) stands in for this one's.
      - run: rm -rf "$RUNNER_TEMP/venv" && python -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/documents/frontend/package-lock.json
      - run: python -m pip install -q --force-reinstall --no-index --find-links vendor --no-deps "plantcraft-sdk==0.100.0"
      - run: python -m pip install -q --find-links vendor -e ".[dev,e2e]"
      # Chromium is downloaded in CI only; the product never fetches anything at runtime.
      - run: python -m playwright install --with-deps chromium
      - run: make e2e
        env:
          DOCCRAFT_E2E_SCREENSHOTS: e2e-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: e2e-screenshots
          path: apps/documents/e2e-screenshots
          if-no-files-found: ignore

  docker:
    if: inputs.hosted || (github.event_name == 'push' && vars.MACMINI_DEPLOY != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build -t doccraft:ci .
      - name: The image starts read-only as in the suite's compose file and answers /healthz
        run: |
          docker run -d --name docs --read-only --tmpfs /tmp:noexec --cap-drop ALL \
            --security-opt no-new-privileges:true -v docsdata:/data -p 8150:8150 doccraft:ci
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8150/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8150/doc/healthz
          docker logs docs
          docker rm -f docs

  # The Mac mini's local suite follows main: the image is rebuilt there and only this app's
  # container is recreated, data kept (ci/macmini/suite-deploy from this checkout, so the deploy hold applies).
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.MACMINI_DEPLOY == 'true'
    runs-on: [self-hosted, macmini]
    concurrency:
      group: deploy-documents
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: make image
      - run: ../../ci/macmini/suite-deploy doccraft=doccraft
