name: Site

# The public site and its chat (site/): the tests read the public documentation the chat answers
# from, so a change to those pages runs them too. CI budget and cadence: ci/macmini/README.md. Pull
# requests run no tests here (Lint and Security check them; contributors run `make -C site ci`
# before merging); main runs them after a change, and by hand (Actions > this workflow > Run).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**/*.md"
      - "apps/*/README.md"
      - "README.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

# Read-only token: no job here writes to the repository.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || vars.TEST_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: rm -rf "$RUNNER_TEMP/venv" && python -m venv "$RUNNER_TEMP/venv" && echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -q -e ".[dev]"
      - run: make ci
