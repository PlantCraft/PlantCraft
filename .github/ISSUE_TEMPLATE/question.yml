name: Question
description: How to install, connect a source, read a result or use an app
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        The guides in [docs/](https://github.com/PlantCraft/PlantCraft/tree/main/docs) answer most questions; [docs/install.md](https://github.com/PlantCraft/PlantCraft/blob/main/docs/install.md) covers installing. Leave out passwords, keys, host names and plant data that are not yours to share.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and app
      description: e.g. "0.5.1, Historian", or "the online demo"
