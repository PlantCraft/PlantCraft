must = ["documents"]

[[question]]
id = "try-without-plant"
kind = "install"
ask = "Can I try it without connecting to a real plant?"
expect = "Yes: the Simulator, an OPC UA plant of 50 control loops with faults on purpose; the demo fills every app; Getting started tour."
sources = ["docs/product-page.md", "simulator/README.md", "docs/en/getting-started.md"]
must = ["simulator|demo"]

# --- Install and sizing -------------------------------------------------------------------------

[[question]]
id = "server"
kind = "sizing"
ask = "What server do I need?"
expect = "Linux with Docker; 4 vCPU and 8 GB for a trial or pilot unit; 8 vCPU, 32 GB and 1 TB SSD recommended for a plant area (8,000 signals, 2,000 loops); measured numbers in requirements."
sources = ["docs/requirements.md", "docs/en/sizing.md", "docs/install.md"]
must = ["vcpu|cpu", "gb"]

[[question]]
id = "windows"
kind = "install"
ask = "Does it run on Windows?"
expect = "For trials and development, yes, with Docker Desktop (WSL 2); plant servers are Linux."
sources = ["docs/install.md", "docs/product-page.md"]
must = ["docker desktop|docker"]

[[question]]
id = "cloud"
kind = "install"
ask = "Is there a SaaS or cloud version we can just log into?"
expect = "No hosted version: it runs on your own servers or a VM you control. The public online demo (simulated data, nothing saved) shows it; install the demo or ask for a guided demo to try it for real."
sources = ["site/knowledge/facts.md"]
must = ["no|not"]
must_not = ["sign up at"]

[[question]]
id = "scale"
kind = "sizing"
ask = "How many signals and users can it handle?"
expect = "Measured up to 8,000 signals and 2,050 loops on 4 vCPU/16 GB; 30 people at once with page p95 1.4 s; a whole site (up to 30,000 signals, 100 people) estimated with more CPU and memory; no licence limit."
sources = ["docs/requirements.md", "docs/en/sizing.md", "docs/product-page.md"]
must = ["8,000|8000|8 000"]

[[question]]
id = "pt-requisitos"
kind = "sizing"
ask = "Quais os requisitos de servidor para uma área da planta?"
expect = "Em português: Linux com Docker; recomendado 8 vCPU, 32 GB, 1 TB SSD para até 8.000 sinais e 2.000 malhas."
sources = ["docs/requirements.md", "docs/en/sizing.md"]
must = ["vcpu|cpu", "gb"]

[[question]]
id = "updates"
kind = "install"
ask = "How do updates work? Can we lose data?"
expect = "Updates take a backup first and roll back by themselves if the new version is not healthy; one data folder; schemas only go forward."
sources = ["docs/product-page.md", "docs/support-policy.md", "docs/install.md"]
must = ["backup|back up|rollback|roll back"]

