# The questions visitors of the site are most likely to ask, with the answer we expect.
#
# Two uses: `make test` checks, without a model, that the search finds a page that answers each
# question (`sources`: any one of them, core pages count as found); `python -m sitechat eval`
# asks the configured model every question and checks its answer:
#   must      every entry must appear in the answer (case ignored); "a|b" accepts either
#   must_not  none may appear
#   contact   true: the answer must offer the contact form; false: it must not
# `expect` is the answer a person on the team would give, for the review and for --judge.
#
# kinds: about, open, secure, llm, fast, data, apps, install, sizing, people, commercial,
# status, build, unknown (not in the docs: say so, offer contact), offtopic, attack.

# --- What it is ---------------------------------------------------------------------------------

[[question]]
id = "what-is"
kind = "about"
ask = "What is PlantCraft?"
expect = "An open suite of industrial software for process engineers (historian, analytics, alarms, dashboards and diagrams, models, documents) in one platform, built to work with AI; open, secure, LLM-first and fast."
sources = ["site/knowledge/facts.md", "docs/product-page.md", "README.md"]
must = ["open", "process engineer|engineers"]
must_not = ["R$", "$"]
contact = false

[[question]]
id = "who-for"
kind = "about"
ask = "Who is it for? I'm a control engineer at a refinery."
expect = "Process and control engineers at plants, researchers and integrators; it helps find loops and signals with problems and plan the fix."
sources = ["site/knowledge/facts.md", "docs/product-page.md"]
must = ["loop|loops"]

[[question]]
id = "pillars"
kind = "about"
ask = "What makes it different from other industrial software?"
expect = "Four pillars: open (all code and methods, Apache-2.0), secure (offline, read-only, sign-in), LLM-first (ask, don't build) and fast (value in days)."
sources = ["site/knowledge/facts.md", "docs/product-page.md"]
must = ["open", "secure|security|offline", "assistant|llm|ai"]

[[question]]
id = "pt-o-que-e"
kind = "about"
ask = "O que é o PlantCraft e para que serve?"
expect = "Em português: uma suíte aberta de software industrial para engenheiros de processo; histórico, análise de malhas e sinais, alarmes, painéis, modelos, documentos; feita para usar com IA."
sources = ["site/knowledge/facts.md", "docs/product-page.md"]
must = ["aberta|aberto|código", "engenheir"]

# --- Open ---------------------------------------------------------------------------------------

[[question]]
id = "free"
kind = "open"
ask = "Is it free?"
expect = "Yes: Apache License 2.0, no paid edition or locked feature. For help at a plant, talk to the team."
sources = ["site/knowledge/facts.md", "docs/product-page.md"]
must = ["apache", "free"]
must_not = ["R$", "US$", "$", "€"]

[[question]]
id = "license-commercial"
kind = "open"
ask = "Can I use it commercially and modify it inside my own product?"
expect = "Yes, Apache-2.0 allows use, change and shipping in your own products; keep the licence and NOTICE files; no paid edition; the names and logos are trademarks."
sources = ["docs/product-page.md", "TRADEMARKS.md", "site/knowledge/facts.md"]
must = ["apache", "yes|can|allow"]

[[question]]
id = "methods-open"
kind = "open"
ask = "Are the loop performance methods a black box?"
expect = "No: every method is open, written from public literature and tested on public data; findings say how they were reached."
sources = ["docs/product-page.md", "apps/link/README.md"]
must = ["open|public"]
must_not = ["black box is"]

[[question]]
id = "lock-in"
kind = "open"
ask = "Can we export our data if we stop using it?"
expect = "Yes: plain Python, Modelica and JSON underneath, export everything at any time: history as CSV from the Historian, models as Modelica files, the plant map as JSON or Excel, reports as PDF or Word; no lock-in."
sources = ["docs/your-data.md", "docs/product-page.md", "site/knowledge/facts.md"]
must = ["export"]

[[question]]
id = "export-history"
kind = "open"
ask = "Can I get the raw process history out as CSV to send to a consultant?"
expect = "Yes: Historian Exports makes a ZIP with series.csv, signals.csv, assets.csv and the plant map, over a chosen period, with aliases instead of real names if wanted."
sources = ["docs/your-data.md"]
must = ["csv"]

[[question]]
id = "uninstall-data"
kind = "open"
ask = "If we uninstall it, what happens to our data?"
expect = "./install.sh --uninstall keeps the data and the backups; only --purge deletes them; the data folder is SQLite and PostgreSQL, readable anywhere."
sources = ["docs/your-data.md", "docs/install.md"]
must = ["purge|kept|keep|stay"]

# --- Secure -------------------------------------------------------------------------------------

[[question]]
id = "write-dcs"
kind = "secure"
ask = "Can PlantCraft write setpoints or tuning to our DCS?"
expect = "No. It is read-only to the plant: no connector has a write call; it never writes to a DCS, PLC, PI or OPC UA server. Only the demo Simulator can be written to."
sources = ["site/knowledge/facts.md", "docs/product-page.md", "docs/security-guide.md", "docs/install.md"]
must = ["read-only|read only|never|no"]
must_not = ["can write setpoints"]

[[question]]
id = "internet"
kind = "secure"
ask = "Does it need internet access or send telemetry?"
expect = "No. It installs offline from a signed bundle; no telemetry, update check, licence call, web font or CDN. The only outbound connections are the plant data sources and, if an admin turns it on, an approved LLM endpoint."
sources = ["docs/product-page.md", "docs/install.md", "docs/security-guide.md"]
must = ["offline|no internet|without internet", "telemetry"]

[[question]]
id = "iec62443"
kind = "secure"
ask = "Our OT security team will ask about IEC 62443. Is there documentation?"
expect = "Yes: a two-page security guide maps the installation to the Purdue model and IEC 62443 for IT and OT teams."
sources = ["docs/product-page.md", "docs/security-guide.md"]
must = ["62443", "security guide|guide"]

[[question]]
id = "ports"
kind = "secure"
ask = "Which ports does it open on the server?"
expect = "One: the HTTPS proxy on 443; every app is on an internal Docker network with no route out."
sources = ["docs/install.md", "docs/product-page.md", "docs/security-guide.md"]
must = ["443|one port|https"]

[[question]]
id = "llm-data"
kind = "secure"
ask = "If we turn on the AI assistant, does our plant data go to OpenAI?"
expect = "Only if an administrator sets up such a provider. Language models are off by default; it can be a model on your own network (any OpenAI-compatible server such as vLLM, Ollama, LM Studio). The assistant reads only what the asking person may read."
sources = ["docs/product-page.md", "docs/assistant.md", "docs/install.md"]
must = ["off|administrator|admin", "own network|local|ollama|vllm|your network"]

[[question]]
id = "pt-seguranca"
kind = "secure"
ask = "É seguro instalar na rede da planta? Ele escreve no SDCD?"
expect = "Em português: sim, instala offline, só lê a planta (nunca escreve em SDCD/CLP/PI/OPC UA), uma porta HTTPS, login por padrão, IA desligada até o admin ligar."
sources = ["docs/product-page.md", "site/knowledge/facts.md", "docs/security-guide.md"]
must = ["não|nunca", "lê|leitura|somente"]

[[question]]
id = "signed"
kind = "secure"
ask = "How do we know the installer was not tampered with?"
expect = "Releases are signed (Ed25519) with SHA-256 hashes and an SBOM; you check the signature with ssh-keygen before unpacking and install.sh checks it again."
sources = ["docs/verify-a-release.md", "docs/install.md", "docs/product-page.md", "docs/install-offline.md"]
must = ["sign"]

[[question]]
id = "verify-how"
kind = "secure"
ask = "How do I check the signature of the bundle before I install it?"
expect = "Write the publisher's key to an allowed_signers file, compare it with the release page, run ssh-keygen -Y verify on the .sha256 with its .sig, then sha256sum -c; both must pass before unpacking."
sources = ["docs/verify-a-release.md", "docs/install.md", "docs/install-offline.md"]
must = ["ssh-keygen"]

[[question]]
id = "verify-windows"
kind = "secure"
ask = "We download releases on Windows. How do we check the signature there?"
expect = "In the Ubuntu window of WSL, where the suite is installed from: the same ssh-keygen and sha256sum commands as on Linux."
sources = ["docs/verify-a-release.md", "docs/install.md"]
must = ["wsl|ubuntu"]

[[question]]
id = "verify-fails"
kind = "secure"
ask = "What should we do if the signature check fails?"
expect = "Do not unpack or install it; copy the files again and check once more; if it still fails, delete them and report it privately as in SECURITY.md."
sources = ["docs/verify-a-release.md", "docs/install-offline.md"]
must = ["not|don't"]

[[question]]
id = "pt-assinatura"
kind = "secure"
ask = "Como confiro se o pacote de instalação é original e não foi alterado?"
expect = "Em português: o pacote é assinado com a chave Ed25519 do publicador; confere-se com ssh-keygen -Y verify e sha256sum antes de descompactar, e o install.sh confere de novo."
sources = ["docs/verify-a-release.md", "docs/install.md", "docs/install-offline.md"]
must = ["ssh-keygen|assinatura|assinado"]

# --- LLM-first ----------------------------------------------------------------------------------

[[question]]
id = "need-llm"
kind = "llm"
ask = "Do I need a cloud AI to use it?"
expect = "No. Analyses, alarms and dashboards work without a language model; the assistant needs one, which can run on your own network, and stays off until an admin sets it up."
sources = ["docs/product-page.md", "docs/assistant.md"]
must = ["no", "own network|local|your network|on premises|on-premises"]

[[question]]
id = "which-llm"
kind = "llm"
ask = "Which language models are supported? Can we use Ollama?"
expect = "Any OpenAI-compatible server (vLLM, Ollama, LM Studio) or Anthropic's API, set up by an administrator in Language models."
sources = ["docs/assistant.md", "docs/en/user-guide.md"]
must = ["ollama|openai-compatible|openai compatible"]

[[question]]
id = "assistant-changes"
kind = "llm"
ask = "Can the assistant change things on its own?"
expect = "No: it reads with the permissions of the person asking; anything it creates is a proposal that person confirms; it never writes to the plant."
sources = ["docs/product-page.md", "docs/assistant.md"]
must = ["confirm|proposal|propos"]

[[question]]
id = "what-ask"
kind = "llm"
ask = "What can I ask the assistant inside the suite?"
expect = "Create blocks, algorithms, alarm rules, models and dashboards; ask why an alarm fired, which alarms to fix first, what changed in a period; answers come from the plant's own data with sources."
sources = ["docs/product-page.md", "docs/assistant.md"]
must = ["alarm|block|model"]

[[question]]
id = "own-ai"
kind = "llm"
ask = "Can I connect my own AI assistant, like Claude or ChatGPT, to the plant data?"
expect = "Yes: a read-only MCP server (off by default), each person with their own token, reading exactly what they may read; and Copy as prompt."
sources = ["docs/assistant-access.md", "docs/product-page.md", "README.md"]
must = ["mcp|copy as prompt"]

# --- Fast ---------------------------------------------------------------------------------------

[[question]]
id = "how-fast"
kind = "fast"
ask = "How long until we see results on our plant?"
expect = "Days, not months: it installs from the offline bundle in under an hour; once it reads the plant's data, Analytics checks every signal and asset from its first round. For a plant project, talk to the team."
sources = ["site/knowledge/facts.md", "docs/install.md"]
must = ["minute|day"]
must_not = ["weeks of setup"]

[[question]]
id = "install-time"
kind = "fast"
ask = "How long does the installation take?"
expect = "Under an hour from the offline bundle to the first sign-in (the demo took about 10 minutes in tests), plus your approvals."
sources = ["docs/install.md", "site/knowledge/facts.md"]
must = ["10|ten"]

