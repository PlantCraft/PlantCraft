# --- Status and building ------------------------------------------------------------------------

[[question]]
id = "maturity"
kind = "status"
ask = "Is it production ready? Who uses it?"
expect = "It is in alpha, built in the open, used on a simulated plant and in trials; screens may change. No customer names."
sources = ["site/knowledge/facts.md", "docs/support-policy.md"]
must = ["alpha"]
must_not = ["is used by", "customers include"]

[[question]]
id = "who-builds"
kind = "status"
ask = "Who is behind PlantCraft?"
expect = "Written almost entirely with Claude Code (an AI coding agent), directed by a process engineer who decides what to build and reviews every result; How we build is public."
sources = ["site/knowledge/facts.md", "docs/how-we-build.md", "docs/product-page.md"]
must = ["claude code|ai"]

[[question]]
id = "build-app"
kind = "build"
ask = "Can my company build its own app for the suite? Does it have to be open source?"
expect = "Yes, open or closed, in its own repository, on the published SDK and interface, starting from the app template with prompts and tests."
sources = ["docs/product-page.md", "templates/app/README.md"]
must = ["template", "closed|open or closed"]

[[question]]
id = "contribute"
kind = "build"
ask = "How can I contribute a new method?"
expect = "See CONTRIBUTING: open an issue or a pull request; make ci before every push; a method is a @method in the app that owns it (most in Analytics), from public literature, with tests; Apache-2.0."
sources = ["CONTRIBUTING.md", "docs/product-page.md"]
must = ["contribut|make ci|pull request"]

[[question]]
id = "report-bug"
kind = "build"
ask = "I found a bug. Where do I report it?"
expect = "As a GitHub issue with the Bug form (what you did, expected, happened, version); a vulnerability privately as in SECURITY.md, never in a public issue."
sources = ["CONTRIBUTING.md", "SECURITY.md"]
must = ["issue"]

[[question]]
id = "translate"
kind = "build"
ask = "Can I help translate the interface into Portuguese?"
expect = "Yes: English is the source; pt-BR entries go in the catalogs (plantcraft/i18n/locales/pt-BR.json, frontend/src/locales/pt-BR.json) as a pull request; tests check the catalogs are complete."
sources = ["CONTRIBUTING.md"]
must = ["pt-br|portuguese|translat"]

[[question]]
id = "pt-contribuir"
kind = "build"
ask = "Como posso contribuir com o projeto?"
expect = "Em português: issues para erros e ideias, pull requests para correções, métodos e traduções; make ci antes de cada push; tudo sob Apache-2.0; veja o CONTRIBUTING."
sources = ["CONTRIBUTING.md"]
must = ["pull request|issue|contribu"]

