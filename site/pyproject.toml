[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plantcraft-site"
version = "0.1.0"
description = "PlantCraft's public site and its chat: answers from the public documentation and takes contact requests"
license = "Apache-2.0"
requires-python = ">=3.11"
# The same pins as the platform's server extra; the language model is called with the standard
# library (urllib), so no provider SDK is installed.
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff==0.17.1",
]

[tool.setuptools]
packages = ["sitechat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["dist"]

[tool.ruff.lint]
# Keep the gate small: real errors (pyflakes), import order, and no time without a time zone.
select = ["F", "I", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["sitechat"]
