[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simcraft"
version = "0.5.0"
description = "PlantCraft Simulator: OPC UA process plant simulator of the PlantCraft suite"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Jonathan Dambros"}]
keywords = ["process-control", "opc-ua", "fault-diagnosis", "simulation", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = ["asyncua==1.1.8"]

[project.optional-dependencies]
test = ["build>=1.3,<2", "jsonschema>=4,<5", "pytest>=9,<10", "pytest-cov>=7,<8", "ruff==0.17.1"]
# The source test kit (simcraft.testkit): development and CI only, never in the image.
testkit = ["amqtt==0.12.1", "pymodbus==3.8.6", "psycopg[binary]>=3.2,<4"]

[project.scripts]
simcraft = "simcraft.cli:main"

[project.urls]
Homepage = "https://github.com/PlantCraft/PlantCraft/tree/main/simulator"
Repository = "https://github.com/PlantCraft/PlantCraft/tree/main/simulator"
Issues = "https://github.com/PlantCraft/PlantCraft/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simcraft = [
  "catalog/*.csv",
  "profiles/v1/*.json",
  "schemas/v1/*.json",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The suite's gate (AGENTS.md): real errors (pyflakes), import order, no time without a time zone.
select = ["F", "I", "DTZ"]

[tool.ruff.lint.isort]
known-first-party = ["simcraft"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["simcraft"]

[tool.coverage.report]
show_missing = true
skip_covered = true
